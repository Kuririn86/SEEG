[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seeg-detector"
version = "0.1.0"
description = "SEEG seizure-state detection competition baseline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.5,<2",
  "matplotlib>=3.8,<4",
  "numpy>=1.26.4,<2",
  "pandas>=2.2,<3",
  "scikit-learn>=1.7,<2",
  "scipy>=1.13,<2",
]

[project.scripts]
seeg-competition = "seeg_detector.orchestration.cli:main"

[project.optional-dependencies]
dev = [
  "jupyterlab>=4.2,<5",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
  "pytest>=8.2,<9",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
